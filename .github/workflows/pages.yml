# Builds the Open I-BOM documentation site (tools/build_site.py) and publishes it to GitHub Pages.
# The site includes /scorecard/ from site/scorecard/. One-time setup: Settings > Pages > Source: GitHub Actions.
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install markdown jsonschema
      - name: Validate the examples the site publishes
        run: |
          for f in examples/minimal.ibom.json examples/ai-gpu-rack.ibom.json examples/pod-b02.ibom.json examples/pod-b02-assessed.ibom.json; do
            python3 tools/ibom_validate.py --quiet "$f"
          done
      - name: Build site (fails on broken internal links)
        run: python3 tools/build_site.py -o _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
